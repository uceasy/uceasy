# Minimal conda environment for running UCEasy with PHYLUCE 1.7 (Python 3).
#
# For a fully reproducible, version-pinned environment, prefer the official
# PHYLUCE 1.7 environment files instead, e.g.:
#   conda env create -f phyluce-1.7.3-py36-Linux-conda.yml
# (see https://github.com/faircloth-lab/phyluce/tree/main/distrib)
#
# This slim file lets conda resolve PHYLUCE 1.7 and its dependencies from
# bioconda, then installs UCEasy on top via pip.
name: phyluce
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.6
  - phyluce=1.7.3
  - pip
  - pip:
      - uceasy
